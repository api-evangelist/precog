aid: precog
name: Precog
description: >-
  Precog is an enterprise AI platform that acts as a "context engine" — turning
  fragmented, context-stripped data from SaaS applications and databases into
  live semantic layers that business users can query in natural language through
  AI assistants like Claude and ChatGPT. Its Intelligent Ingest builds no-code
  ETL pipelines from any business application into a data warehouse, detecting
  data relationships automatically and injecting business logic, definitions and
  relationships during ingestion, while its AI Assistants layer adds source
  tracing and SQL visibility for trustworthy answers. Precog exposes a public
  HTTP REST API (sources, destinations, pipelines, datasets, semantic-model
  generation) and an OAuth-secured Model Context Protocol (MCP) server, and was
  surfaced through the Techstars portfolio into the API Evangelist network.
