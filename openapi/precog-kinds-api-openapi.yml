openapi: 3.1.0
info:
  title: http-api Admin Kinds API
  version: '1.0'
  summary: The Precog admin HTTP REST API.
  description: The Precog admin HTTP REST API.
  contact:
    url: https://precog.com
    email: support@precog.com
servers:
- url: http://localhost:30000
security:
- BearerAuth: []
tags:
- name: Kinds
paths:
  /kinds/{kind-id}:
    parameters:
    - schema:
        type: string
      name: kind-id
      in: path
      required: true
    get:
      summary: Get connector schema
      tags:
      - Kinds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema:
                    $ref: '#/components/schemas/kind-schema'
                  auth:
                    $ref: '#/components/schemas/auth-schema'
                required:
                - schema
        '401':
          description: Unauthorized
        '404':
          description: Kind not found.
      operationId: get-kinds-kind-id
      description: Get the configuration schema for a particular kind of source.
  /kinds/source:
    get:
      summary: Get source kinds
      tags:
      - Kinds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/connector-kind'
              examples:
                example-1:
                  value:
                  - id: '1'
                    name: Active Campaign
                    image: data:image/svg+xml;base64,
                  - id: '2'
                    name: Ariba Analytics
                  - id: '3'
                    name: Bing Ads
                  - id: '4'
                    name: Chargeback
                  - id: '5'
                    name: Clockify
                  - id: '6'
                    name: Everflow
                  - id: '7'
                    name: Facebook Ads
                  - id: '8'
                    name: Google Ads
                  - id: '9'
                    name: Gravity Forms
                  - id: '10'
                    name: Hubspot
                  - id: '11'
                    name: Salesforce
                  - id: '12'
                    name: Shopify
                  - id: '13'
                    name: WooCommerce
        '401':
          description: Unauthorized
      operationId: get-kinds-source
      description: Retrieve the available kinds of sources.
  /kinds/destination:
    get:
      summary: Get destination kinds
      tags:
      - Kinds
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/connector-kind'
              examples:
                example-1:
                  value:
                  - id: '14'
                    name: Snowflake
                    image: data:image/svg+xml;base64,
                  - id: '15'
                    name: Panoply
                  - id: '16'
                    name: Redshift
                  - id: '17'
                    name: Google BigQuery
                  - id: '18'
                    name: Firebolt
        '401':
          description: Unauthorized
      operationId: get-kinds-destination
      description: Retrieve the available kinds of destinations.
components:
  schemas:
    kind-schema:
      description: ''
      type: array
      title: ''
      items:
        oneOf:
        - $ref: '#/components/schemas/kind-schema-input-entry'
        - $ref: '#/components/schemas/kind-schema-upload-entry'
        - $ref: '#/components/schemas/kind-schema-dropdown-entry'
    connector-kind:
      description: ''
      type: object
      title: ''
      properties:
        name:
          type: string
          minLength: 1
        id:
          type: string
          minLength: 1
        image:
          type: string
      required:
      - name
      - id
    kind-schema-upload-field:
      description: ''
      type: object
      title: ''
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
      required:
      - description
      - name
    kind-schema-dropdown-entry:
      title: ''
      type: object
      properties:
        input:
          $ref: '#/components/schemas/kind-schema-dropdown-field'
      required:
      - input
    kind-schema-dropdown-field:
      description: ''
      type: object
      title: ''
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
        values:
          type: array
          minLength: 1
          uniqueItems: true
          items:
            type: string
      required:
      - description
      - name
      - values
    kind-schema-upload-entry:
      title: ''
      type: object
      properties:
        upload:
          $ref: '#/components/schemas/kind-schema-upload-field'
      required:
      - upload
    auth-schema:
      title: auth-schema
      type: object
      properties:
        type:
          type: string
          enum:
          - OAuth 2.0 code authorization
          - Google Service Account Key authorization
        details:
          oneOf:
          - $ref: '#/components/schemas/auth-schema-oauth2-details'
          - $ref: '#/components/schemas/auth-schema-google-service-account-details'
      required:
      - type
      - details
    auth-schema-google-service-account-details:
      title: auth-schema-google-service-account-details
      type: object
      properties:
        scopes:
          type: array
          uniqueItems: true
          items:
            type: string
            minLength: 1
      required:
      - scopes
    kind-schema-input-entry:
      title: ''
      type: object
      properties:
        input:
          $ref: '#/components/schemas/kind-schema-input-field'
      required:
      - input
    kind-schema-input-field:
      description: ''
      type: object
      title: ''
      properties:
        description:
          type: string
        sensitive:
          type: boolean
        name:
          type: string
          minLength: 1
        exampleValue:
          type: string
      required:
      - description
      - sensitive
      - name
    auth-schema-oauth2-details:
      title: auth-schema-oauth2-details
      type: object
      properties:
        uri:
          type: string
          minLength: 1
      required:
      - uri
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
