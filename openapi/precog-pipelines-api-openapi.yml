      - type: object
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - reuse-previous
      - type: object
        required:
        - type
        - primaryKey
        properties:
          type:
            type: string
            enum:
            - use-provided
          primaryKey:
            $ref: '#/components/schemas/primary-key-property'
      - type: boolean
      examples:
      - type: detect-anew
      - type: reuse-previous
      - type: use-provided
