          items:
            $ref: '#/components/schemas/drifted-dataset'
      required:
      - pipelineId
      - status
    dataset-metadata:
      description: Dataset tables
      type: object
      title: Dataset tables
      properties:
        datasetId:
          type: string
          minLength: 1
        tables:
          type: array
          title: Datasets
          items:
            $ref: '#/components/schemas/table'
    error-message:
